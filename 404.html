<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Ali Pira</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#F7F9FA;--ink:#16212B;--muted:#5C6F80;--line:#DFE7ED;--teal:#0B7A72;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0C1218;--ink:#E7EEF4;--muted:#8FA3B5;--line:#223140;--teal:#3ECBBB}
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  min-height:100vh;display:grid;place-items:center;padding:24px;
}
main{max-width:460px;text-align:center}
.code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.85rem;letter-spacing:.14em;color:var(--teal);
  text-transform:uppercase;margin-bottom:14px;
}
h1{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15;margin-bottom:14px;font-weight:600}
p{color:var(--muted);margin-bottom:26px}
a{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9rem;
  color:var(--teal);text-decoration:none;
  border:1px solid var(--line);border-radius:8px;padding:10px 16px;display:inline-block;
}
a:hover{border-color:var(--teal)}
</style>
</head>
<body>
<main>
  <p class="code">404 · not plotted</p>
  <h1>This page isn't on the chart.</h1>
  <p>The address may have moved, or it never existed. Everything that does exist is one page over.</p>
  <a href="/">← Back to alipira.github.io</a>
</main>
</body>
</html>
